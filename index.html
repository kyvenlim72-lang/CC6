<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#143f32">
<title>NTU Loop · A little return. A bigger change.</title>
<style>
:root{--ink:#143f32;--muted:#56665d;--paper:#f6f5ef;--lime:#d6ed83;--line:#dce1d7}
*{box-sizing:border-box}body{margin:0;background:#e5e9df;color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a35b21;outline-offset:4px}button{touch-action:manipulation}h1,h2,h3,p{margin:0}h1{font-size:38px;line-height:1.08;letter-spacing:-1.6px;font-weight:650}h2{font-size:25px;letter-spacing:-.8px;line-height:1.25}h3{font-size:18px}p{color:var(--muted)}.shell{max-width:480px;min-height:100dvh;margin:auto;background:var(--paper);position:relative;padding-bottom:100px;box-shadow:0 0 80px #143f3210}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 15px}.brand{font-size:24px;font-weight:800;letter-spacing:-1.2px;display:flex;gap:8px;align-items:center}.brand span{font-weight:400}.brand svg{width:29px;height:29px}.demo{font-size:10px;font-weight:700;letter-spacing:1.3px;border:1px solid #c5cdbf;border-radius:30px;padding:5px 9px}.content{padding:16px 24px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:12px}.intro{max-width:320px;margin:14px 0 24px;font-size:15px}.hero{border-radius:26px;background:var(--ink);color:white;padding:22px;position:relative;overflow:hidden}.hero p{color:#d6e4d7}.hero-top,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{display:inline-flex;align-items:center;gap:6px;background:#e9f0df;border-radius:30px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--ink)}.hero .pill{background:#ffffff17;color:#ecf5d9}.dot{width:6px;height:6px;background:var(--lime);border-radius:50%}.box-art{height:180px;width:100%;display:block}.hero-title{font-size:22px;letter-spacing:-.5px}.serial{font-family:monospace;font-size:12px;letter-spacing:1px}.button{border:0;border-radius:15px;min-height:52px;padding:13px 18px;background:var(--ink);color:white;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none}.button.lime{background:var(--lime);color:var(--ink)}.button.secondary{background:transparent;border:1px solid #c2ccbf;color:var(--ink)}.hero .button{margin-top:20px}.fine{font-size:12px;line-height:1.5}.notice{display:flex;align-items:flex-start;gap:10px;margin:16px 3px 26px;font-size:13px;color:var(--muted)}.notice svg{flex-shrink:0;margin-top:1px}svg.icon{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}.section-title h2{font-size:20px}.textbutton{border:0;background:none;min-height:44px;padding:8px 0;color:var(--ink);font-weight:700;font-size:13px}.station{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;text-align:left;width:100%;color:var(--ink)}.station p{font-size:13px;margin:6px 0}.station.selected{border:2px solid var(--ink);padding:17px;background:#eff3e6}.station .pill{margin-top:6px}.mini-icon{width:44px;height:44px;border-radius:14px;background:#edf1e6;display:grid;place-items:center;flex-shrink:0}.row{display:flex;gap:13px;align-items:center}.callout{padding:22px;border-radius:22px;background:#e9eddf;margin-top:20px}.callout p{font-size:14px;margin-top:8px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#f6f5eff5;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;padding:8px 8px max(10px,env(safe-area-inset-bottom));z-index:5}.bottom button{flex:1;background:none;border:0;min-height:58px;font-size:10px;color:var(--muted);display:flex;align-items:center;flex-direction:column;gap:5px;border-radius:14px}.bottom button[aria-current=page]{background:#e5ebd9;color:var(--ink);font-weight:700}.bottom svg{margin-top:6px}.steps{display:flex;gap:5px;margin:22px 0}.step{height:4px;flex:1;background:#dfe4d7;border-radius:4px}.step.on{background:var(--ink)}.label{font-size:12px;font-weight:700;display:block;margin:22px 0 8px}select,input{border:1px solid #b7c2b4;border-radius:12px;background:white;width:100%;padding:14px;color:var(--ink);min-height:50px}.scanner{margin:22px 0;background:var(--ink);height:230px;border-radius:25px;display:grid;place-items:center;position:relative}.scan-frame{width:148px;height:148px;border:2px solid var(--lime);border-radius:20px;display:grid;place-items:center;background:#ffffff08}.scanner:after{content:"DEMO SCANNER · NO CAMERA";position:absolute;bottom:14px;color:#c5d8c4;font-size:9px;letter-spacing:1.5px}.scan-frame svg{height:94px;width:94px;opacity:.85}.stack{display:grid;gap:12px;margin-top:20px}.error{color:#a12c20;font-size:14px;margin:10px 0;min-height:21px}.receipt{background:white;border:1px solid var(--line);padding:24px;border-radius:24px;margin:24px 0}.receipt .between{padding:13px 0;border-bottom:1px dashed var(--line);font-size:14px}.receipt .between:last-child{border:0}.success{width:88px;height:88px;background:var(--lime);border-radius:50%;display:grid;place-items:center;margin:26px auto}.success svg{width:44px;height:44px}.center{text-align:center}.flow-item{display:flex;gap:16px;margin:24px 0}.number{height:38px;width:38px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex-shrink:0;font-weight:700}.flow-item p{font-size:14px;margin-top:6px}.screen-enter{animation:enter .25s ease-out}@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.screen-enter{animation:none}}@media(max-width:360px){.content{padding:14px 18px}h1{font-size:34px}.top{padding:20px 18px}}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M25 12A10 10 0 0 0 7 9L3 15m0-7v7h7M7 20a10 10 0 0 0 18 3l4-6m0 7v-7h-7"/></svg>ntu<span>loop</span></div><span class="demo">INTERACTIVE DEMO</span></header>
<main id="main" class="content" tabindex="-1"></main>
<nav class="bottom" aria-label="Main navigation" id="nav"></nav>
<div id="announcement" class="sr" role="status" aria-live="polite"></div>
</div>
<script>
const icons={
home:'<path d="m3 10 9-7 9 7v10H4V10M9 20v-7h6v7"/>',
qr:'<path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 14v3h3v4m3-7v3m-7 4h1m6 0h1"/>',
pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',
loop:'<path d="M20 9a8 8 0 0 0-14-3L3 9m0-5v5h5M4 15a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/>',
check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/>'
};
const icon=n=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">${icons[n]}</svg>`;
const qr=`<svg viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="#d6ed83" stroke-width="7"><path d="M7 7h25v25H7zM68 7h25v25H68zM7 68h25v25H7zM47 7v16m0 12v19H7m37 14v25m13-48h36M60 60v16h16v17m17-32v15M57 93h7M93 87v6"/><path d="M16 16h7v7h-7zM77 16h7v7h-7zM16 77h7v7h-7z"/></svg>`;
const art=`<svg class="box-art" role="img" aria-label="Reusable green food container with a QR label" viewBox="0 0 340 180"><ellipse cx="169" cy="151" rx="104" ry="13" fill="#0a2d24"/><path d="M59 74q0-13 15-18l149-17q14-2 25 7l35 30-14 59q-2 9-14 11l-129 17q-12 1-21-6L66 122Z" fill="#95b48b"/><path d="m66 84 65 49 139-22-1 24q-2 9-14 11l-129 17q-12 1-21-6L66 122Z" fill="#769b70"/><path d="M53 75q-3-12 14-17l150-20q15-2 27 6l40 28q15 12-2 21l-144 25q-13 3-24-4Z" fill="#d8e6bd"/><path d="m75 72 139-19q14-2 25 6l24 16-130 23Z" fill="#b8cfa3"/><path d="m177 69 34-5 18 13-35 6Z" fill="#f6f5ef"/><g stroke="#143f32" stroke-width="3"><path d="m186 70 7-1 4 3-7 1zM201 68l7-1 4 3-7 1zM195 76l7-1 4 3-7 1zM211 74l6 4"/></g><path d="M41 49Q37 27 66 23" stroke="#d6ed83" stroke-width="2" fill="none"/><path d="m60 18 8 5-7 5" stroke="#d6ed83" stroke-width="2" fill="none"/><circle cx="289" cy="122" r="17" fill="#d6ed83"/><path d="m282 122 5 5 9-10" fill="none" stroke="#143f32" stroke-width="2"/></svg>`;
let page='home',stage='scan',station='North Spine',error='';
// Demo rules, not an approved NTU reward or fee policy.
const POINTS_PER_RETURN=10, RETURN_WINDOW_MS=3*24*60*60*1000, LATE_FEE_CENTS=200;
let loan=null, receipt=null, points=0, schoolFeesCents=0;
const stations=[{name:'North Spine',detail:'Food court · demo station A',open:true,clean:20,returned:10},{name:'South Spine',detail:'Food court · demo station B',open:true,clean:20,returned:10},{name:'Hall cluster',detail:'Residential area · demo station C',open:false,clean:20,returned:10}];
try {
 const state=JSON.parse(sessionStorage.getItem('ntu-loop-state'));
 const saved=state?state.loan:JSON.parse(sessionStorage.getItem('ntu-loop-loan'));
 if(saved && saved.id==='LOOP-0248' && Number.isFinite(saved.borrowedAt) && saved.borrowedAt<=Date.now() && stations.some(s=>s.name===saved.station)) loan=saved;
 if(state){
  if(Number.isSafeInteger(state.schoolFeesCents)&&state.schoolFeesCents>=0)schoolFeesCents=state.schoolFeesCents;
  if(Number.isSafeInteger(state.points)&&state.points>=0)points=state.points;
  if(state.inventoryVersion===2&&Array.isArray(state.stations))stations.forEach(s=>{const savedStation=state.stations.find(x=>x.name===s.name);if(savedStation && Number.isSafeInteger(savedStation.clean)&&savedStation.clean>=0 && Number.isSafeInteger(savedStation.returned)&&savedStation.returned>=0){s.clean=savedStation.clean;s.returned=savedStation.returned}});
 }
 if(loan&&(!state||state.inventoryVersion!==2)){const source=stations.find(s=>s.name===loan.station);source.clean=Math.max(0,source.clean-1)}
} catch (_) { /* Storage unavailable: keep an in-memory demo. */ }
function saveLoan(){try{sessionStorage.setItem('ntu-loop-state',JSON.stringify({inventoryVersion:2,loan,points,stations,schoolFeesCents}));sessionStorage.setItem('ntu-loop-loan',JSON.stringify(loan))}catch(_){}}
const availableMachines=()=>stations.filter(s=>s.open&&s.clean>0).length;
const canBorrow=s=>s.open&&s.clean>0;
const onTime=(start,end)=>end-start<=RETURN_WINDOW_MS;
const money=cents=>'S$'+(cents/100).toFixed(2);
function assessLateFee(now=Date.now()){
 if(loan&&!onTime(loan.borrowedAt,now)&&loan.lateCharged!==true){
  loan.lateCharged=true;schoolFeesCents+=LATE_FEE_CENTS;saveLoan();
  document.getElementById('announcement').textContent='Container overdue. A one-time S$2 late/replacement charge has been added to school fees in this demo. No real charge was made.';
 }
}
function billing(){return `<div class="callout"><h3>School fees · demo</h3><p><strong id="school-fees">${money(schoolFeesCents)}</strong> in container charges</p><p class="fine">A one-time S$2 late/replacement fee is added after 3 days (72 hours) if the container is still unreturned. No daily charges. Returning late does not reverse the fee. This is simulated; no school account is charged.</p></div>`}

function rewards(){return `<div class="callout"><div class="between"><div><p class="eyebrow">Your Loop points</p><h2>${points} points</h2></div><span class="mini-icon">${icon('loop')}</span></div><p>Earn ${POINTS_PER_RETURN} points for each return within 3 days (72 hours).</p><p class="fine">Demo reward rule · points have no cash value. Late returns earn no points; existing points are kept.</p></div>`}
function availability(){return `<div class="callout"><div class="between"><h3>${availableMachines()} of ${stations.length} machines</h3>${icon('pin')}</div><p>Available to borrow now · demo inventory</p><p class="fine">Each machine starts with 30 containers: 20 clean and 10 awaiting washing. Counts online machines with clean stock. Returned containers await central washing before restocking.</p></div>`}
function rewardStatus(){if(!loan)return '';const remaining=loan.borrowedAt+RETURN_WINDOW_MS-Date.now();return remaining>=0?`Return within ${duration(remaining)} to earn ${POINTS_PER_RETURN} points.`:'Late — one-time S$2 late/replacement fee added to school fees (demo). Return your container to close the loan; no points will be added.'}
function duration(ms){const seconds=Math.max(0,Math.floor(ms/1000));return `${Math.floor(seconds/3600)}h ${Math.floor(seconds/60)%60}m ${seconds%60}s`}
function holding(){return loan?`<div class="receipt"><span class="eyebrow">Currently holding · one container</span><h2>LOOP-0248</h2><div class="between"><span>Holding time</span><strong id="holding-time">${duration(Date.now()-loan.borrowedAt)}</strong></div><p class="fine">Started ${new Date(loan.borrowedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${loan.station}<br>Return this container before borrowing another. This is elapsed holding time, not a fee countdown.</p><p class="fine" id="reward-status" style="margin-top:12px">${rewardStatus()}</p><p class="fine">Return by: ${new Date(loan.borrowedAt+RETURN_WINDOW_MS).toLocaleString()} (3 days / 72 hours).</p></div>`:''}
setInterval(()=>{assessLateFee();const fees=document.getElementById('school-fees');if(fees)fees.textContent=money(schoolFeesCents);const timer=document.getElementById('holding-time');if(timer&&loan)timer.textContent=duration(Date.now()-loan.borrowedAt);const status=document.getElementById('reward-status');if(status&&loan)status.textContent=rewardStatus()},1000);
function borrow(){return `<div class="eyebrow">Borrow a container</div><h1>Your next meal.<br>A fresh start.</h1><p class="intro">Scan the QR code on an NTU Loop machine to borrow one clean container.</p>${availability()}<label class="label" for="station">Choose a demo machine</label><select id="station">${stations.map(s=>`<option value="${s.name}" ${s.name===station?'selected':''} ${!canBorrow(s)?'disabled':''}>${s.name} · ${s.open?s.clean+' clean / '+(s.clean+s.returned)+' total':'offline'}</option>`).join('')}</select>${availableMachines()===0?'<p class="error">No machines have clean containers right now. Please try again after restocking.</p>':''}<div class="scanner"><div class="scan-frame">${qr}</div></div><button class="button" data-action="borrow" ${!stations.some(s=>s.name===station&&canBorrow(s))?'disabled':''}>${icon('qr')} Simulate machine QR scan & borrow</button><div class="callout"><h3>One container at a time</h3><p>After this simulated scan, your 3-day (72-hour) return period begins. Return within that period for 10 points. If still unreturned afterwards, a one-time S$2 late/replacement fee is added to school fees (demo only). Return it before borrowing again.</p></div><p class="fine" style="margin-top:20px">Demo only. No camera, NTU sign-in or physical machine is connected.</p>`}


const main=document.getElementById('main');
function navigate(p){page=p;error='';if(page==='return'&&!loan&&!stations.some(s=>s.name===station&&canBorrow(s))){station=stations.find(canBorrow)?.name||''}render()}
function render(){
 assessLateFee();
 document.getElementById('nav').innerHTML=[['home','Home','home'],['return',loan?'Return':'Borrow','qr'],['stations','Stations','pin'],['guide','The loop','loop']].map(([id,label,i])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');
 main.className='content screen-enter';
 if(page==='home')main.innerHTML=home();
 if(page==='return')main.innerHTML=loan?(stage==='confirm'?confirm():scan()):borrow();
 if(page==='receipt')main.innerHTML=receipt?success():home();
 if(page==='stations')main.innerHTML=stationScreen();
 if(page==='guide')main.innerHTML=guide();
 main.focus({preventScroll:true});window.scrollTo(0,0);
}
function home(){return `<div class="eyebrow">Small habit. Shared future.</div><h1>Good food.<br>Less waste.</h1><p class="intro">${loan?'Enjoy your meal. Your container is yours until you return it.':'Start with a clean container. Return it when your meal is done.'}</p>
<section class="hero"><div class="hero-top"><span class="pill"><span class="dot"></span>${loan?'AWAITING RETURN':'NO CONTAINER BORROWED'}</span>${icon('loop')}</div>${art}<div class="between"><div><h2 class="hero-title">${loan?'One box. Many possibilities.':'Your loop starts here.'}</h2><p class="serial">${loan?'LOOP-0248 · DEMO CONTAINER':'BORROW · ENJOY · RETURN'}</p></div></div><button class="button lime" data-action="start">${loan?'Return this container':'Borrow a container'} ${icon('arrow')}</button></section>${holding()}${rewards()}${billing()}${availability()}
<div class="notice">${icon('shield')}<span>No deposit. Return within 3 days.<br><span class="fine">After 72 hours: one-time S$2 late/replacement fee, added to school fees in this demo.</span></span></div>
<div class="section-title"><h2>Find your next stop</h2><button class="textbutton" data-page="stations">View stations ↗</button></div>
<button class="station" data-action="select" data-station="North Spine" ${!loan&&!canBorrow(stations[0])?'disabled':''}><div class="row"><span class="mini-icon">${icon('pin')}</span><div><h3>North Spine</h3><p>${stations[0].open?stations[0].clean+' clean containers · returns accepted':'Offline'}</p></div><span aria-hidden="true">↗</span></div></button>
<div class="callout"><div class="between"><h3>Reuse. Return. Repeat.</h3>${icon('loop')}</div><p>We take care of the washing. You keep a useful container in circulation.</p><button class="textbutton" data-page="guide">See how the whole loop works →</button></div><p class="fine" style="margin-top:20px">Showcase prototype · station data and transactions are simulated. Your loan stays in this browser tab across reloads; closing the tab clears the demo session.</p>`}
function scan(){return `<div class="eyebrow">Return a container · 1 of 2</div><h1>Back into<br>the loop.</h1><p class="intro">At a real station, the machine reads your container’s QR code. Try that moment here.</p>${holding()}<div class="steps"><span class="step on"></span><span class="step"></span></div><label class="label" for="station">Choose a demo return station</label><select id="station">${stations.map(s=>`<option ${s.name===station?'selected':''} ${!s.open?'disabled':''}>${s.name}${!s.open?' — unavailable':''}</option>`).join('')}</select><div class="scanner"><div class="scan-frame">${qr}</div></div><button class="button" data-action="simulate">${icon('qr')} Simulate QR scan</button><label class="label" for="code">Or enter the container ID</label><form id="code-form"><input id="code" name="code" placeholder="Try LOOP-0248" autocomplete="off" spellcheck="false" aria-describedby="code-error"><p class="error" id="code-error" role="alert">${error}</p><button class="button secondary" type="submit">Check container ID</button></form><p class="fine" style="margin-top:18px">This demo does not use your camera or connect to a machine. The QR illustration is decorative.</p>`}
function confirm(){return `<div class="eyebrow">Return a container · 2 of 2</div><h1>That’s your box.</h1><p class="intro">Container recognised. Place it in the return opening to finish.</p><div class="steps"><span class="step on"></span><span class="step on"></span></div><div class="receipt"><span class="pill">${icon('check')} MATCH FOUND</span><h2 style="margin:20px 0">LOOP-0248</h2><div class="between"><span>Return station</span><strong>${station}</strong></div><div class="between"><span>Loan status</span><strong>Still borrowed</strong></div></div><div class="callout"><h3>One last step</h3><p>A scan identifies the container. In the real system, the machine must also confirm that it received the box before closing the loan.</p></div><div class="stack"><button class="button" data-action="deposit">Simulate container deposited ${icon('arrow')}</button><button class="button secondary" data-action="back">Back to scan</button></div>`}
function success(){return `<div class="eyebrow">Loop completed</div><div class="success">${icon('check')}</div><div class="center"><h1>Returned.<br>And ready for more.</h1><p class="intro" style="margin:16px auto">Your demo loan is closed.<br>Thank you for keeping the loop going.</p></div><div class="receipt"><h3>Return confirmation</h3><div class="between"><span>Container</span><strong>LOOP-0248</strong></div><div class="between"><span>Station</span><strong>${receipt.station}</strong></div><div class="between"><span>Held for</span><strong>${duration(receipt.durationMs)}</strong></div><div class="between"><span>${receipt.earned?'On-time return':'Outside reward window'}</span><strong>+${receipt.earned} points</strong></div><div class="between"><span>Your total</span><strong>${points} points</strong></div><div class="between"><span>Late/replacement fee</span><strong>${money(receipt.feeCents)}</strong></div><p class="fine">${receipt.feeCents?'Added to school fees · simulated, no real charge.':'Returned on time · no school-fee charge.'}</p><div class="between"><span>Status</span><span class="pill">No container held</span></div></div><div class="callout"><h3>What happens to your box?</h3><p>Staff collect it, wash and sanitise it centrally, then inspect it and restock a machine. Another meal, another loop.</p></div><div class="stack"><button class="button" data-page="home">Back to home</button><button class="button secondary" data-action="start">Borrow another container</button></div>`}
function stationScreen(){return `<div class="eyebrow">A return that fits your day</div><h1>Any machine.<br>One shared loop.</h1><p class="intro">Return at a different NTU Loop machine from where you borrowed.</p>${availability()}<span class="pill">Illustrative stations · not live locations</span>${stations.map(s=>`<button class="station ${station===s.name?'selected':''}" data-action="select" data-station="${s.name}" ${(!s.open||(!loan&&!canBorrow(s)))?'disabled':''}><div class="between"><h3>${s.name}</h3>${icon('pin')}</div><p>${s.detail}</p><p><strong>${s.clean+s.returned} containers at machine</strong></p><p>${s.clean} clean · ${s.returned} awaiting washing</p><span class="pill">${!s.open?'Offline':loan?'Accepting returns →':s.clean>0?'Available to borrow →':'No clean containers · returns accepted'}</span></button>`).join('')}<div class="callout"><h3>Machine unavailable?</h3><p>Keep your container and use another available station. A failed scan or unavailable machine does not close your loan.</p></div>`}
function guide(){return `<div class="eyebrow">Designed to come full circle</div><h1>A better takeaway.<br>In four steps.</h1><p class="intro">Shared containers. Less single-use packaging. A system that does the washing for you.</p>${[['Scan & borrow','Scan the machine QR to borrow one clean container in this demo. Your holding timer starts. No upfront deposit.'],['Fill & enjoy','Take it to a participating stall and get your favourite meal.'],['Scan & return','Drop it into any NTU Loop machine. Its QR code identifies the box; receipt by the machine closes the loan.'],['Clean & repeat','Staff collect, centrally wash, sanitise and inspect containers before restocking machines.']].map(([h,p],i)=>`<div class="flow-item"><span class="number">${i+1}</span><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}<div class="callout"><h3>Reuse first.</h3><p>The aim is to keep the same container useful through many meals. Environmental benefits depend on actual reuse, washing and transport.</p><p>No deposit. Return within 3 days (72 hours). If still unreturned after the deadline, a one-time S$2 late/replacement fee is added to school fees (simulated). No daily fee. Disposable packaging has a proposed surcharge of about S$0.30.</p></div><div class="stack"><button class="button" data-action="start">${loan?'Return your container':'Try borrowing a container'} ${icon('arrow')}</button></div>`}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.page){navigate(b.dataset.page);return}
 switch(b.dataset.action){
 case 'start':stage='scan';navigate('return');break;
 case 'receipt':navigate('receipt');break;
 case 'borrow':if(loan||page!=='return'||!stations.some(s=>s.name===station&&canBorrow(s)))return;stations.find(s=>s.name===station).clean--;loan={id:'LOOP-0248',borrowedAt:Date.now(),station};saveLoan();stage='scan';document.getElementById('announcement').textContent='Demo container borrowed. Holding timer started.';navigate('home');break;
 case 'simulate':if(!loan||page!=='return')return;stage='confirm';navigate('return');break;
 case 'back':stage='scan';navigate('return');break;
 case 'deposit':if(!loan||page!=='return'||stage!=='confirm'||!stations.some(s=>s.name===station&&s.open))return;const finishedAt=Date.now();assessLateFee(finishedAt);const earned=onTime(loan.borrowedAt,finishedAt)?POINTS_PER_RETURN:0;receipt={id:loan.id,station,durationMs:Math.max(0,finishedAt-loan.borrowedAt),earned,feeCents:loan.lateCharged===true?LATE_FEE_CENTS:0};points+=earned;stations.find(s=>s.name===station).returned++;loan=null;saveLoan();stage='scan';document.getElementById('announcement').textContent=`Demo return confirmed. ${earned} points earned. Total ${points} points.`;navigate('receipt');break;
 case 'select':station=b.dataset.station;stage='scan';navigate('return');break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='station'){station=e.target.value;if(!loan)render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='code-form')return;e.preventDefault();if(!loan||page!=='return')return;const input=document.getElementById('code');if(input.value.trim().toUpperCase()==='LOOP-0248'){stage='confirm';navigate('return')}else{document.getElementById('code-error').textContent='Container not recognised. For this demo, enter LOOP-0248.';input.setAttribute('aria-invalid','true');input.focus()}});
render();
</script>
</body>
</html>
